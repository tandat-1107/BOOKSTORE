
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý thu mua - BOOKSTORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="container my-5">
        <div class="d-flex justify-content-between
                    align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="section-title mb-2">
                    <i class="bi bi-arrow-left-right"></i>
                    Quản lý thu mua sách cũ
                </h1>
                <p class="text-muted">
                    Tiếp nhận, báo giá và nhập kho sách đã thu mua
                </p>
            </div>

            <a href="dashboard.html"
                class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Về Dashboard
            </a>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="admin-stat">
                    <div class="admin-stat-icon">
                        <i class="bi bi-journals"></i>
                    </div>
                    <h3 id="buyback-count">0</h3>
                    <p>Tổng yêu cầu</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="admin-stat">
                    <div class="admin-stat-icon">
                        <i class="bi bi-clock-history"></i>
                    </div>
                    <h3 id="buyback-pending">0</h3>
                    <p>Đang chờ duyệt</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="admin-stat">
                    <div class="admin-stat-icon">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <h3 id="buyback-completed">0</h3>
                    <p>Đã thu mua</p>
                </div>
            </div>
        </div>

        <h5 class="fw-bold mb-3">Danh sách yêu cầu</h5>
        <div id="admin-buyback-list"></div>
    </main>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/buyback.js"></script>
</body>
</html>
