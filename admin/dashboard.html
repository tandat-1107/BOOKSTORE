
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - BOOKSTORE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="admin-layout">
        <div id="admin-sidebar"></div>

        <main class="admin-content" data-page="dashboard">
            <h1 class="section-title mb-2">Tổng quan cửa hàng</h1>
            <p class="text-muted mb-4">
                Theo dõi hoạt động kinh doanh BOOKSTORE
            </p>

            <div class="row g-4">
                <div class="col-md-6 col-xl-3">
                    <div class="admin-stat">
                        <div class="admin-stat-icon">
                            <i class="bi bi-book"></i>
                        </div>
                        <h3 id="stat-books">0</h3>
                        <p>Tổng số sách</p>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="admin-stat">
                        <div class="admin-stat-icon">
                            <i class="bi bi-bag"></i>
                        </div>
                        <h3 id="stat-orders">0</h3>
                        <p>Tổng đơn hàng</p>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="admin-stat">
                        <div class="admin-stat-icon">
                            <i class="bi bi-people"></i>
                        </div>
                        <h3 id="stat-customers">0</h3>
                        <p>Khách hàng</p>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="admin-stat">
                        <div class="admin-stat-icon">
                            <i class="bi bi-currency-dollar"></i>
                        </div>
                        <h3 id="stat-revenue">0đ</h3>
                        <p>Doanh thu hoàn thành</p>
                    </div>
                </div>
            </div>

            <div class="row g-4 mt-2">
                <div class="col-lg-5">
                    <div class="admin-table-card h-100">
                        <h5 class="fw-bold mb-4">Trạng thái đơn hàng</h5>
                        <canvas id="orders-chart"></canvas>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="admin-table-card h-100">
                        <h5 class="fw-bold mb-4">Đơn hàng gần đây</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Mã đơn</th>
                                        <th>Khách hàng</th>
                                        <th>Tổng tiền</th>
                                        <th>Trạng thái</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-orders"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
