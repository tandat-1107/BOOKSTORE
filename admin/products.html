
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý sách - BOOKSTORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="header"></div>

    <div class="admin-layout">
        <div id="admin-sidebar"></div>

        <main class="admin-content" data-page="products">
            <div class="d-flex justify-content-between
                align-items-center flex-wrap gap-3 mb-4">
                <div>
                    <h1 class="section-title mb-1">Quản lý sách</h1>
                    <p class="text-muted mb-0">
                        Thêm, chỉnh sửa và quản lý sản phẩm
                    </p>
                </div>

                <button id="reset-product" class="btn btn-primary"
                    data-bs-toggle="modal" data-bs-target="#productModal">
                    <i class="bi bi-plus-lg"></i> Thêm sách mới
                </button>
            </div>

            <div class="admin-table-card">
                <div class="row mb-4">
                    <div class="col-md-5">
                        <input id="admin-search" class="form-control"
                            placeholder="Tìm kiếm sách...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Sản phẩm</th>
                                <th>Thể loại</th>
                                <th>Giá bán</th>
                                <th>Tồn kho</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header">
                    <h5 id="product-modal-title" class="modal-title fw-bold">
                        Thêm sách mới
                    </h5>
                    <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>

                <form id="product-form">
                    <div class="modal-body">
                        <input type="hidden" id="product-id">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Tên sách</label>
                                <input id="product-title"
                                    class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Tác giả</label>
                                <input id="product-author"
                                    class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Thể loại</label>
                                <input id="product-category"
                                    class="form-control" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Giá bán</label>
                                <input id="product-price" type="number"
                                    min="1" class="form-control" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Giá gốc</label>
                                <input id="product-original-price"
                                    type="number" min="1"
                                    class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Tồn kho</label>
                                <input id="product-stock" type="number"
                                    min="0" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Đánh giá</label>
                                <input id="product-rating" type="number"
                                    min="0" max="5" step="0.1"
                                    value="5" class="form-control" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">URL hình ảnh</label>
                                <input id="product-image"
                                    class="form-control" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Mô tả</label>
                                <textarea id="product-description"
                                    class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-primary">
                            Lưu sản phẩm
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
