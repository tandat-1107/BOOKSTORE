
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán - BOOKSTORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="container my-5">
        <h1 class="section-title">
            <i class="bi bi-credit-card"></i>
            Thanh toán đơn hàng
        </h1>

        <form id="checkout-form">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="cart-panel">
                        <h5 class="fw-bold mb-4">
                            Thông tin nhận hàng
                        </h5>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ và tên</label>
                                <input id="customer-name"
                                       class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">
                                    Số điện thoại
                                </label>
                                <input id="customer-phone"
                                       type="tel"
                                       class="form-control" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Email</label>
                                <input id="customer-email"
                                       class="form-control" readonly>
                            </div>

                            <div class="col-12">
                                <label class="form-label">
                                    Địa chỉ giao hàng
                                </label>
                                <textarea id="customer-address"
                                          class="form-control"
                                          rows="3" required></textarea>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Ghi chú</label>
                                <textarea id="customer-note"
                                          class="form-control"
                                          rows="2"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="cart-panel mt-4">
                        <h5 class="fw-bold mb-4">
                            Phương thức thanh toán
                        </h5>

                        <div class="form-check">
                            <input class="form-check-input"
                                   type="radio" checked>
                            <label class="form-check-label">
                                Thanh toán khi nhận hàng (COD)
                            </label>
                        </div>

                        <p class="text-muted small mt-3">
                            Đây là chức năng đặt hàng mô phỏng.
                        </p>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="summary-panel">
                        <h5 class="fw-bold mb-4">Đơn hàng của bạn</h5>

                        <div id="checkout-items"></div>

                        <div class="summary-row summary-total">
                            <span>Tổng thanh toán</span>
                            <span id="checkout-total"
                                  class="text-danger">0đ</span>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 mt-3">
                            Xác nhận đặt hàng
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/cart.js"></script>
</body>
</html>
