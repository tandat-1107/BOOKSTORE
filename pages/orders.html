
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đơn hàng của tôi - BOOKSTORE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="container my-5">
        <h1 class="section-title">
            <i class="bi bi-receipt"></i>
            Đơn hàng của tôi
        </h1>

        <div id="my-orders"></div>
    </main>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>

    <script>
        $(async function () {
            await BookStore.ready;

            if (!BookStore.requireLogin()) return;

            const user = BookStore.user();

            const orders = BookStore.orders()
                .filter(order => order.userId === user.id)
                .reverse();

            if (!orders.length) {
                $("#my-orders").html(`
                    <div class="empty-state">
                        <i class="bi bi-receipt"></i>
                        <h4>Bạn chưa có đơn hàng nào</h4>
                        <a href="${BookStore.url("pages/books.html")}"
                           class="btn btn-primary">
                            Mua sách ngay
                        </a>
                    </div>
                `);
                return;
            }

            $("#my-orders").html(orders.map(order => `
                <div class="cart-panel mb-4">
                    <div class="d-flex justify-content-between
                                flex-wrap gap-2 mb-3">
                        <div>
                            <h5 class="fw-bold">
                                Đơn #${order.id}
                            </h5>
                            <span class="text-muted">
                                ${BookStore.escape(order.date)}
                            </span>
                        </div>

                        <span class="badge bg-primary align-self-start">
                            ${BookStore.escape(order.status)}
                        </span>
                    </div>

                    ${order.items.map(item => `
                        <div class="d-flex justify-content-between
                                    border-top py-3">
                            <span>
                                ${BookStore.escape(item.title)}
                                × ${item.quantity}
                            </span>

                            <strong>
                                ${BookStore.money(
                                    item.price * item.quantity
                                )}
                            </strong>
                        </div>
                    `).join("")}

                    <div class="text-end border-top pt-3">
                        <strong class="text-danger">
                            Tổng: ${BookStore.money(order.total)}
                        </strong>
                    </div>
                </div>
            `).join(""));
        });
    </script>
</body>
</html>
