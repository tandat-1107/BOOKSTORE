
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cửa hàng sách - BOOKSTORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="container my-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a href="/index.html">Trang chủ</a>
                </li>
                <li class="breadcrumb-item active">Tất cả sách</li>
            </ol>
        </nav>

        <div class="mb-4">
            <h1 class="section-title mb-2">Khám phá sách</h1>
            <p class="section-subtitle">
                Tìm kiếm cuốn sách yêu thích của bạn
            </p>
        </div>

        <div class="row g-4">
            <aside class="col-lg-3">
                <div class="filter-panel">
                    <h5 class="mb-4">
                        <i class="bi bi-funnel"></i> Bộ lọc
                    </h5>

                    <div class="mb-4">
                        <label class="filter-label">Tìm kiếm</label>
                        <input id="search-input" class="form-control"
                            placeholder="Tên sách, tác giả...">
                    </div>

                    <div class="mb-4">
                        <label class="filter-label">Thể loại</label>
                        <select id="category-filter" class="form-select">
                            <option value="">Tất cả thể loại</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="filter-label">Sắp xếp</label>
                        <select id="sort-filter" class="form-select">
                            <option value="">Mặc định</option>
                            <option value="price-asc">Giá tăng dần</option>
                            <option value="price-desc">Giá giảm dần</option>
                            <option value="name">Tên A - Z</option>
                            <option value="rating">Đánh giá cao nhất</option>
                        </select>
                    </div>

                    <a href="books.html" class="btn btn-outline-primary w-100">
                        Xóa bộ lọc
                    </a>
                </div>
            </aside>

            <div class="col-lg-9">
                <div class="d-flex justify-content-between
                    align-items-center mb-4">
                    <h5 class="fw-bold mb-0">Tất cả sản phẩm</h5>
                    <span class="text-muted">
                        <span id="result-count">0</span> sản phẩm
                    </span>
                </div>

                <div id="book-list" class="row g-4"></div>

                <div id="pagination"
                    class="d-flex justify-content-center gap-2 mt-5">
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/books.js"></script>
</body>
</html>
