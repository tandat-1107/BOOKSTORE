
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giỏ hàng - BOOKSTORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="container my-5">
        <h1 class="section-title">
            <i class="bi bi-bag"></i> Giỏ hàng của bạn
        </h1>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="cart-panel">
                    <h5 class="fw-bold mb-3">Sản phẩm đã chọn</h5>
                    <div id="cart-items"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="summary-panel">
                    <h5 class="fw-bold mb-4">Tóm tắt đơn hàng</h5>

                    <div class="summary-row">
                        <span>Tạm tính</span>
                        <strong id="cart-subtotal">0đ</strong>
                    </div>

                    <div class="summary-row">
                        <span>Phí vận chuyển</span>
                        <span class="text-success">Miễn phí (demo)</span>
                    </div>

                    <div class="summary-row summary-total">
                        <span>Tổng cộng</span>
                        <span id="cart-total" class="text-danger">0đ</span>
                    </div>

                    <a href="checkout.html"
                        class="btn btn-primary w-100 mt-3">
                        Tiến hành thanh toán
                        <i class="bi bi-arrow-right"></i>
                    </a>

                    <a href="books.html"
                        class="btn btn-outline-primary w-100 mt-3">
                        Tiếp tục mua sắm
                    </a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/cart.js"></script>
</body>
</html>
